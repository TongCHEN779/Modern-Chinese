<section class="entry" id="e1">
<p class="v nv">衣裳上，</p>
<p class="v nv">书页上，</p>
<p class="v nv">都闪烁着</p>
<p class="v nv">叶底细碎的朝阳。</p>
<p class="v nv">我折下一朵来，</p>
<p class="v nv">等着—等着，</p>
<p class="v nv">浓红的花瓣，</p>
<p class="v nv">正好衬她雪白的衣裳。</p>
<p class="v nv">冰凉的石阶上，</p>
<p class="v nv">坐着——坐着，</p>
<p class="v nv">等她不来，</p>
<p class="v nv">只闻见手里</p>
<p class="v nv">玫瑰的幽香！</p>
<p class="v nv">五，十八，一九二二</p>
</section>
