<section class="entry" id="e1">
<p class="v nv">（一九五九年九月七日）</p>
<p class="v nv">乔木同志：</p>
<p class="v nv">诗两首，请你送给郭沫若同志一阅，看有什么毛病没有？加以笔削，是为至要。主题虽好，诗意无多，只有几句较好一些的，例如“云横九派浮黄鹤”之类。诗难，不易写，经历者如鱼饮水，冷暖自知，不足为外人道也。</p>
<p class="v nv">毛泽东 九月七日</p>
