<section class="entry" id="e1">
<p class="v nv">飒爽英姿五尺枪，曙光初照演兵场。中华儿女多奇志，不爱红装爱武装。</p>
<p class="v nv">这首诗最早发表在人民文学出版社一九六三年十二月版《毛主席诗词》。</p>
</section>
<section class="entry" id="e2">
<h3>注释</h3>
<p class="v nv">飒爽形容敏捷勇健。唐杜甫《丹青引》：“英姿飒爽来酣战。”</p>
</section>
