<section class="entry" id="e1">
<p class="v nv">前三年，元微之为予编次文集而叙之。凡五帙，每帙十卷，讫长庆二年冬，号《白氏长庆集》。迩来复有格诗、律诗、碑志、序记、表赞，以类相附，合为卷轴，又从五十一以降，卷而第之。是时，大和二年秋，予春秋五十有七，目昏头白，衰也久矣；拙音狂句，亦已多矣。由兹而后，宜其绝笔；若习未尽，时时一咏，亦不自知也。因附前集报微之，故复序于卷首云尔。</p>
