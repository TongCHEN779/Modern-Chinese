<section class="entry" id="e1">
<p class="v nv">当义军首领马化龙被绑上凌迟大架时，湘军刽子手提着刻心肝用的尖刀，笑着问他：</p>
<p class="v nv">今天灭你八门三百口，以后谁是你的后人？</p>
<p class="v nv">马化龙说：以后凡大地上念“俩依俩罕<sup class="n" data-n="1"></sup>印安拉子”的人，都是我的后人。</p>
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 注释（1）</button><ul class="notes plain" id="n1" hidden><li>俩依俩罕：清真言首句；万物非主。</li></ul>
<p class="v nv">刽子手又问：可是有谁能给你报仇？</p>
<p class="v nv">马化龙预言：四十年后，有人出来为我报仇。</p>
