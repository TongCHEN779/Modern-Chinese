<section class="entry" id="e1">
<p class="v nv">甲子开岁二日，得雪，雪晴赋此</p>
<p class="v nv">雪的尸布将过去掩藏。</p>
<p class="v nv">现在天东升上了朝阳，</p>
<p class="v nv">看哪！黄金染遍了千家白屋顶上；</p>
<p class="v nv">瑶林里百鸟欢唱，</p>
<p class="v nv">听哪！万里内迎神的鞭爆齐扬！</p>
<p class="v nv">（以上十二首选自《夏天》）</p>
</section>
