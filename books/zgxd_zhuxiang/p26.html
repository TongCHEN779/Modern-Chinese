<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">我心爱的雨景也多着呀：</p>
<p class="v nv">春夜梦回时窗前的淅沥；</p>
<p class="v nv">急雨点打上蕉叶的声音；</p>
<p class="v nv">雾一般拂着人脸的雨丝</p>
<p class="v nv">从电光中泼下来的雷雨——</p>
<p class="v nv">但将雨时的天我最爱了。</p>
<p class="v nv">它虽然是灰色的却透明；</p>
<p class="v nv">它蕴着一种无声的期待。</p>
<p class="v nv">并且从云气中，不知那里，</p>
<p class="v nv">飘来了一声清脆的鸟啼。</p>
<p class="v nv">一九二四年十一月二十二日</p>
</section>
