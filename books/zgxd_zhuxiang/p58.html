<section class="entry" id="e1">
<p class="v nv">谁能压得住火山不爆？</p>
<p class="v nv">就是岩石也无法隄防，</p>
<p class="v nv">它取道</p>
<p class="v nv">去寻太阳。</p>
<p class="v nv">口</p>
<p class="v nv">当不住劲风，</p>
<p class="v nv">也不能叫松；</p>
<p class="v nv">要北风怒号，</p>
<p class="v nv">才会有松涛，</p>
<p class="v nv">澎湃过</p>
<p class="v nv">黑云与紫电的长气：</p>
<p class="v nv">一九二六年十月二十一日</p>
</section>
