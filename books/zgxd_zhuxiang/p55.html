<section class="entry" id="e1">
<p class="v nv">与空气一般，无从捉摸，</p>
<p class="v nv">亦不知抵抗，</p>
<p class="v nv">远望去是一片青，落落</p>
<p class="v nv">展开在天上……</p>
<p class="v nv">狎弄它的要隄防暴风</p>
<p class="v nv">米号令一切，</p>
<p class="v nv">凭它得到的权势兴隆，</p>
<p class="v nv">随了它毁灭。</p>
</section>
