<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">今宵是桂的中秋：</p>
<p class="v nv">明月光照在清流。</p>
<p class="v nv">原野间鸟声止奏，</p>
<p class="v nv">剩寒蛩鸣咽抒愁。</p>
<p class="v nv">媚阳春一去不还，</p>
<p class="v nv">色与香从此阑珊一</p>
<p class="v nv">再不要登高望远，</p>
<p class="v nv">万里中只见秋山！</p>
<p class="v nv">不如趁皓月当头，</p>
<p class="v nv">与嫦娥竞夕淹留。</p>
<p class="v nv">莲蓬作盃子饮酒，</p>
<p class="v nv">送归鸿飞过山陬。</p>
<p class="v nv">一九二六年九月二十日</p>
</section>
