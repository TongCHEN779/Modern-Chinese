<section class="entry" id="e1">
<p class="v nv">谁见过黄瘦的花</p>
<p class="v nv">累累结成硕果？</p>
<p class="v nv">池沼中只有鱼虾，</p>
<p class="v nv">不是藏蛟之所。</p>
<p class="v nv">人不曾有过青春，</p>
<p class="v nv">象花开，不盛，</p>
<p class="v nv">象水长，不深，</p>
<p class="v nv">不要想丰富的秋分！</p>
<p class="v nv">太阳射下了金光，</p>
<p class="v nv">照着花开满地；</p>
<p class="v nv">春雨洒上了新秋，</p>
<p class="v nv">田中一片绿意。</p>
<p class="v nv">培养生命要爱情；</p>
<p class="v nv">它比水还润，</p>
<p class="v nv">比日光还温，</p>
<p class="v nv">沾着它的无不茂生。</p>
</section>
