<section class="entry" id="e1">
<p class="v nv">海是我的母亲，</p>
<p class="v nv">我向伊的怀里流去。</p>
<p class="v nv">一日</p>
<p class="v nv">伊将抱着我倦了的身子，</p>
<p class="v nv">摇着，</p>
<p class="v nv">哼着催睡的歌儿；</p>
<p class="v nv">我的灵魂将化为轻云，</p>
<p class="v nv">飘飘的腾入空际，</p>
<p class="v nv">——而又变形的落到地上，</p>
<p class="v nv">被伊的爱力吸落到地上了。</p>
<p class="v nv">阴阴春雨中</p>
<p class="v nv">远处的泉声活活了。</p>
</section>
