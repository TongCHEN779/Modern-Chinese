<h1>端阳<small>朱湘</small></h1>

</header>
<main class="reading-layout">

<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">满城飘着艾叶的浓香；</p>
<p class="v nv">两把菖蒲悬挂在门旁，</p>
<p class="v nv">它们的犀利有如宝剑，</p>
<p class="v nv">为要镇防五毒的猖狂。</p>
<p class="v nv">这天酒里面都放雄黄，</p>
<p class="v nv">家家无老少都拿酒尝；</p>
<p class="v nv">儿童的额上画着王字；</p>
<p class="v nv">喝不完的酒洒满一房</p>
<p class="v nv">孩子们穿着老虎衣裳，</p>
<p class="v nv">粽子呀粽子，尽是呼娘，</p>
<p class="v nv">娘，你带我瞧划龙船去，</p>
<p class="v nv">好容易今天到了端阳！</p>
<p class="v nv">一九二五年十二月十二日</p>
</section>
