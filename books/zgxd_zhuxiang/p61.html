<section class="entry" id="e1">
<p class="v nv">描花的宫绢渗下灯光：</p>
<p class="v nv">柔软灯光，</p>
<p class="v nv">掩映纱窗，</p>
<p class="v nv">我们围在红炭盆旁，</p>
<p class="v nv">看炉香</p>
<p class="v nv">游丝股的徐徐袅上</p>
<p class="v nv">架，须是梅朵娇黄。</p>
<p class="v nv">宾客无人不夸奖厨娘：</p>
<p class="v nv">妖艳厨娘，</p>
<p class="v nv">糕饼当行，</p>
<p class="v nv">嗅呀，它像樱口微张，</p>
<p class="v nv">息芬芳，</p>
<p class="v nv">那柔软又唇儿一样，</p>
<p class="v nv">人怎不争着先尝？</p>
</section>
