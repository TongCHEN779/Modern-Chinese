<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">纸窗下恬静的油灯，</p>
<p class="v nv">室腰明，顶作圆形</p>
<p class="v nv">灯罩边仰首青年</p>
<p class="v nv">神游于圆影的中心。</p>
<p class="v nv">饽饽的吆呼远闻；</p>
<p class="v nv">上房中假哭着阿鲲；</p>
<p class="v nv">晚饭菜厨下炒着，</p>
<p class="v nv">好一片有望的声音。</p>
<p class="v nv">——那时间无虑无忧，</p>
<p class="v nv">如今呵变了逃囚。</p>
<p class="v nv">但仍亮你的，油灯，</p>
<p class="v nv">你的圆仍可神游。</p>
</section>
