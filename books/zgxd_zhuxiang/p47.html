<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">唱一支古旧，古旧的歌……</p>
<p class="v nv">朦胧的，在月下，</p>
<p class="v nv">回忆，苍白着，远望天边</p>
<p class="v nv">不知何处的家……</p>
<p class="v nv">说一句悄然，悄然的话……</p>
<p class="v nv">有如漂泊的风，</p>
<p class="v nv">不知怎么来的，在耳语，</p>
<p class="v nv">对了草原的梦……</p>
<p class="v nv">落一滴迟缓，迟缓的泪……</p>
<p class="v nv">与露珠一样冷，</p>
<p class="v nv">在衣衿上，心坎上，不知</p>
<p class="v nv">何时落的，无声……</p>
</section>
