<section class="entry" id="e1">
<p class="v nv">贫苦的文人两手空空，</p>
<p class="v nv">剩一点柔情揣在当胸。</p>
<p class="v nv">命运那强徒忒是不公，</p>
<p class="v nv">这点爱情于他并无用，</p>
<p class="v nv">都被动林中。</p>
<p class="v nv">朋友，那地方能息游踪？</p>
<p class="v nv">我与你高歌阮籍途穷。</p>
<p class="v nv">在夕阳道上同蹈斜红，</p>
<p class="v nv">让西风卷起心头悲痛，</p>
<p class="v nv">乱洒进苍穹！</p>
<p class="v nv">一九二六年十一月三十日</p>
</section>
