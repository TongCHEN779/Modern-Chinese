<section class="entry" id="e1">
<p class="v nv">太阳只是灰云上一个白盘罢了，</p>
<p class="v nv">他的光明却浸透了清朗的空中，</p>
<p class="v nv">反映在地上雨水凹的上面。</p>
<p class="v nv">黑干赭条的柳树安闲的立着，</p>
<p class="v nv">仿佛等候着什么似的。</p>
<p class="v nv">远近四处听到无数争喧的鸟声，</p>
<p class="v nv">河水也活活起来了。</p>
</section>
