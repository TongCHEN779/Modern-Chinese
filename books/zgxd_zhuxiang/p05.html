<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">黑树影静立在灰色晚天的前面，</p>
<p class="v nv">哑哑争枝的鸟啼已经倦的低下去了。</p>
<p class="v nv">炊烟炉香似的笔直升入空际，</p>
<p class="v nv">远田边农夫的黑影扛着锄头回来了。</p>
<p class="v nv">这时候诗人虔诚的走到郊外，</p>
<p class="v nv">来接受静默赐给他的诗思；</p>
<p class="v nv">伊们是些跳动的珠形小白环，</p>
<p class="v nv">他慢慢的将伊们绣在晚天的黑色薄纱上了。</p>
</section>
