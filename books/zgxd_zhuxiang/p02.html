<section class="entry" id="e1">
<p class="v nv">有风时白杨萧萧着，</p>
<p class="v nv">无风时白杨萧萧着；</p>
<p class="v nv">萧萧外更不听到什么：</p>
<p class="v nv">野花悄悄的发了，</p>
<p class="v nv">野花悄悄的谢了；</p>
<p class="v nv">悄悄外园里更没什么。</p>
