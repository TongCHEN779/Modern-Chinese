<section class="entry" id="e1">
<p class="v nv">我仿佛坐在一只船上，</p>
<p class="v nv">摇过了灰白单调的荒岸，</p>
<p class="v nv">现在淌入一片鸟语花香的境地；</p>
<p class="v nv">我的船仿佛并未前进，</p>
<p class="v nv">只看见两行绿柳伸过来，</p>
<p class="v nv">一霎时将我抱进了伊的怀里。</p>
</section>
