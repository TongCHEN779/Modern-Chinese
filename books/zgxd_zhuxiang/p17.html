<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">葬我在荷花池内，</p>
<p class="v nv">耳边有水蚓拖声，</p>
<p class="v nv">在绿荷叶的灯上</p>
<p class="v nv">萤火虫时暗时明——</p>
<p class="v nv">葬我在马缨花下，</p>
<p class="v nv">永作着芬芳的梦</p>
<p class="v nv">葬我在泰山之巅，</p>
<p class="v nv">风声鸣咽过孤松——</p>
<p class="v nv">不然，就烧我成灰，</p>
<p class="v nv">投入泛滥的春江，</p>
<p class="v nv">与落花一同漂去</p>
<p class="v nv">无人知道的地方。</p>
<p class="v nv">一九二五年二月二日</p>
</section>
