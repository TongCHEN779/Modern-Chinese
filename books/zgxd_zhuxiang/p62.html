<section class="entry" id="e1">
<p class="v nv">惺松的月亮微呪着夜神，</p>
<p class="v nv">林木悄然而卧不动分纹。</p>
<p class="v nv">远田内有群蛙高声笑乐，</p>
<p class="v nv">叶底的萤光一瞥目传情。</p>
<p class="v nv">一九三〇年五月十五日</p>
</section>
