<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">你可以寻遍天堂，</p>
<p class="v nv">从日生的时候寻到日死：</p>
<p class="v nv">还燃起白烛夜中去寻觅——</p>
<p class="v nv">你决不会寻到一种东西，</p>
<p class="v nv">假君子！</p>
<p class="v nv">你可以游遍阴曹，</p>
<p class="v nv">看火油的锅里千人惨死；</p>
<p class="v nv">这些鬼魂，无论多么叛逆，</p>
<p class="v nv">他们总远强似一种东西，</p>
<p class="v nv">假君子！</p>
</section>
