<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">美丽拿装束卸下了，镜子</p>
<p class="v nv">知道它是真的呢还是谎；</p>
<p class="v nv">对着灵魂，它照见了真相，</p>
<p class="v nv">照不见善，恶——人造的名词。</p>
<p class="v nv">不响，成天里它只是深思</p>
<p class="v nv">又深思……平坦在它的面上，</p>
<p class="v nv">以及冷静，明白；不见往常</p>
<p class="v nv">那些幻影，与它们的美，疵。</p>
</section>
