<section class="entry" id="e1">
<p class="v nv">我是一个惫殆的游人，</p>
<p class="v nv">蹒跚于旷漠之原中，</p>
<p class="v nv">我形影孤单，挣扎前进，</p>
<p class="v nv">伴我的有秋暮的悲风。</p>
<p class="v nv">你们的心是一间茅屋，</p>
<p class="v nv">小窗中射出友谊的红光；</p>
<p class="v nv">我的灵魂呵，火边歇下罢，</p>
<p class="v nv">这正是你长眠的地方。</p>
</section>
