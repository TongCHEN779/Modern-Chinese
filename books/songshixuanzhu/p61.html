<section class="entry" id="e1">
<h3>翁卷小传</h3>
<p class="v nv">翁卷（生年死年不详）字续古，一字灵舒，永嘉人，有《苇碧轩集》。</p>
</section>
<section class="entry" id="e2">
<h3>野望</h3>
<p class="v nv">一天秋色冷晴湾，<br>无数峰峦远近间。<br>闲上山来看野水，<br>忽于水底见青山。</p>
</section>
<section class="entry" id="e3">
<h3>乡村四月</h3>
<p class="v nv">绿遍山原白满川，<br>子规声里雨如烟。<br>乡村四月闲人少，<br>才了蚕桑又插田。</p>
</section>
