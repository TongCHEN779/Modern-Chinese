<section class="entry" id="e1">
<p class="v nv">朝发轫于苍梧兮，夕余至乎县圃；</p>
<p class="v nv">欲少留此灵琐兮，日忽忽其将暮。</p>
<p class="v nv">吾令羲和弭节兮，望崦嵫而勿迫；</p>
<p class="v nv">路漫漫其修远兮，吾将上下而求索。</p>
<p class="v nv">屈原：《离骚》。</p>
</section>
