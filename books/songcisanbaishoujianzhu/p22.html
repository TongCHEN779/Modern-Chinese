<section class="entry" id="e1">
<p class="v nv">亶，字信道，明州慈溪人。治平二年进士，试礼部第一。神宗朝，为御史中丞。徽宗朝，累除龙图阁待制。近赵万里辑有《舒学士词》一卷。</p>
</section>
<section class="entry" id="e2">
<h3>虞美人</h3>
<p class="v nv poem">芙蓉落尽天涵水，<br>日暮沧波起。<br>背飞双燕贴云寒，<br>独向小楼东畔倚阑看。</p>
<p class="v nv poem">浮生只合尊前老，<br>雪满长安道。<br>故人早晚上高台，<br>寄我江南春色一枝梅。</p>
</section>
