<section class="entry" id="e1">
<p class="v nv">曩见经目，见《一梦漫言》，意谓今人所撰导俗书也。因求得一册，披卷寻诵，乃知为明宝华山见月律师自述行脚事也。欢喜踊跃，叹为希有。反复环读，殆忘饮食。悲欣交集，涕泪不已。因略为料简附以眉注，并考舆图，别录行脚图表一纸。冀后之学者，披文析义，无有壅滞耳。甲戌八月十日披诵讫，二十五日录竟并记，时居晋水兰若。</p>
