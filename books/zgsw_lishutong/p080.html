<section class="entry" id="e1">
<p class="v nv">甲戌九月，依《一梦漫言》及别传摭录；唯举梗概，未能详耳。《漫言》上卷，自记年岁数次，可为依据。今编年谱，准此推衍。下卷谓顺治七年五十岁者，或有舛误，以待后贤改订焉。晋水尊胜院沙门亡言。</p>
