<section class="entry" id="e1">
<p class="v nv">余以阁愚，获闻大法，实由地藏菩萨本愿摄之，益大师《宗论》导之。战兢自勉，垂二十载。常念慈恩，未尝一日忘也。去岁大醒法主曾辑《益大师集》，既已付刊；近复赍示《地藏菩萨本愿经说要》草稿，殷勤三复，不胜庆跃！为述昔缘，以证志同道合焉。岁次甲戌三月，晋水尊胜院沙门一音。</p>
