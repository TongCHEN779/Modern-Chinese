<section class="entry" id="e1">
<p class="v nv">壬戍岁晚，幻居永宁，研寻毗奈耶藏。辄以时暇，检灵峰《五戒相经笺要》，旁参有部律文等，纂辑《五戒持犯表记》一卷。区分章节，排比表相，悉出创作，意在简要。草稿既就，皮置箱箧。比以孟由居士劝请弘布，乃披旧册，略事修治，并增《三归略义》、《八戒略义》二篇，敬贻来世。冀抱瓮燋火，倘有微益。岁在癸亥磨祛月黑分褒洒陀日，学律沙门昙昉书。</p>
