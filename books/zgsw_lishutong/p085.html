<section class="entry" id="e1">
<p class="v nv">泉郡素称海滨邹鲁，朱文公尝于东北高阜，建亭种竹，讲学其中，岁久倾圮。明嘉靖间，通判陈公重建斯亭，题曰过化，后亦毁于兵燹。尔者叶居士青眼欲复古迹，请书亭额补焉。余昔在俗，潜心理学，独尊程朱。今来温陵，补题过化，何莫非胜缘耶。逊国后二十四年，岁在乙亥，沙门一音书，时年五十有六。</p>
