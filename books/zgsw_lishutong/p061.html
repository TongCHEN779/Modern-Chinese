<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">余来三衢，未一谒宰官居士；惟治行前朝，尝过莴庐（一作硕果巷）乞吴明经书旭光室额。于时朝曦入檐，沉寒在袖。明经焚香扫地，举笔拜手而后落墨。曰：“吾书未工，诚意为贵”也。明经字子弓，年七十九。目微盲能作大字。通考据性理之学。安德忘贫，不慕荣利，三衢多耆宿，君其首出矣。</p>
