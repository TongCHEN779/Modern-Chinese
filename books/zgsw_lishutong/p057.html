<section class="entry" id="e1">
<p class="v nv">己亥之秋，文社叠起，闻风所及，渐次继兴。义取盍簪，志收众艺。寸金双玉，斗角钩心。各擅胜场，无美弗备。鄙谬不自揣，手录一编。莛撞管窥，矢日惭讷。佚漏之弊，知不免焉。尤望大雅宏达，缀而益之，以匡鄙之不逮云。当湖惜霜仙史识。</p>
<p class="v nv">（内书：“当湖惜霜仙史编辑”.“庚子莫春，李庐校印”。）</p>
