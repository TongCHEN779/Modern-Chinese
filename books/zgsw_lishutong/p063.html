<section class="entry" id="e1">
<p class="v nv">十数年来，久疏雕技。今老矣，离俗披剃，勤修梵行，寗复多暇耽玩于斯？顷以幻缘，假立臣名及以别字，手制数印，为志庆喜。后之学者览兹残砾，将毋笑其结习未忘耶？于时岁阳玄默吠舍佉月白分八日。余与丐尊相交久，未尝示其雕技，今赍以供山房清赏。弘裔沙门僧胤并记（案所刻五印皆白文，为“大慈、弘裔、胜月、大心凡夫、僧胤。）</p>
