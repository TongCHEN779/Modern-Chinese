<section class="entry" id="e1">
<p class="v nv">曩余在清尘堂讲《药师如来法门》，后由诸善友印施讲录，其时经他人辗转抄写，颇有讹误。兹由觉圆法师捐资再版印行，请余校正原稿广为流布。法师出家以来，于药师法门最为信仰，近拟于泉州兴建大药师寺，其愿力广大，尤足令人赞叹之。</p>
<p class="v nv">沙门一音</p>
