<section class="entry" id="e1">
<p class="v nv">《五戒相经笺要》，今有二本。金陵新刻，校点疏略，文字句读并多讹舛。旧刻莫审所出，较前为善，而流布者希，觅求非易。今检丽藏古本，旁考大律，详校经文，小有改订；并分章节，指序条贯。虽于文义，不无割裂，取便初学，非无益矣。别述补释三章，录于卷末。敢以浅学，向附前规。明哲倘览，幸为研尽，备其未详也。于时十三年岁阳阏逢沙门昙昉。</p>
