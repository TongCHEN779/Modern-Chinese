<section class="entry" id="e1">
<p class="v nv">唐人诗云：“人间爱晚晴”，髫之岁喜诵之。今垂老矣，犹复未忘，亦莫自知其由致也。因颜所居曰晚晴院，聊以记念旧之怀耳。书者永宁陶长者文星，年九十三。陶长者既为余书晚晴院额，张居士蔚亭，并写此本。耄德书翰，集于一堂，弥足珍玩，不胜忭跃，沙门弘一识。</p>
