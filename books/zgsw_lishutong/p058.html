<section class="entry" id="e1">
<p class="v nv">索居无俚，久不托音。短檠夜明，遂多羁绪。又值变乱，家国沦陷。山邱华屋，风闻声咽。天地顿隘，啼笑胥乖。乃以余闲，滥竽文社，辄取两事，纂为俪句。空梁落燕，庭草无人。只句珍异，有愧向哲。岁月既久，储积寖繁。覆瓿摧薪，意有未忍。用付剞阙，就正通人。技类雕虫，将毋齿冷？赐之斧削，有深企焉。庚子鼓平月。</p>
</section>
