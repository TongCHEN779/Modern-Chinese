<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">李（圆净）、丰（子恺）二居士，发愿流布《护生画集》，盖以艺术作方便，人道主义为宗趣。每画一叶，附白话诗选。录古德者十七首，余皆贤瓶闲道人补题。并书二偈，而为回向。</p>
<p class="v nv">我依画意，</p>
<p class="v nv">为白话诗。</p>
<p class="v nv">意在导俗，</p>
<p class="v nv">不尚文词。</p>
<p class="v nv">普愿众生，</p>
<p class="v nv">承斯功德；</p>
<p class="v nv">同发菩提，</p>
<p class="v nv">往生乐国。</p>
</section>
