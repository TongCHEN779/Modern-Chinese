<section class="entry" id="e1">
<p class="v nv">本不了心，妄取尘境，随境起业，业生妄受。今达本妄，体虚不实，自耻往业，交搆所造。如蚕作茧，非他所缠。深生惭愧，誓断妄习。如斯念念，不忘境缘，无量罪垢，自然除净。</p>
<p class="v nv">己卯十月十二日晨，敬录业疏文。</p>
