<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">依大师自撰《八不道人传》及成时续传录写；复检《宗论》中诸文增改，并参考别行诸疏序跋补订焉。己未居钱塘初稿，辛酉掩室永嘉改纂，乙亥住温陵月台再治。老病缠绵，精力颓弊，未能详密校理，殊自恧心。</p>
<p class="v nv">年谱诸文虽有撮录，或加润饰，但悉有所据。若述私意，则写双行小字，上冠“案”字，以区别焉。</p>
</section>
