<section class="entry" id="e1">
<p class="v nv">居俗之日，尝好临写碑帖。积久盈尺，藏于欬尊居士小梅花屋，十数年矣。尔者居士选辑一帙，将以锓版示诸学者，请余为文冠之卷首。夫耽乐书术，增长放逸，佛所深诫。然研习之者能尽其美，以是书写佛典，流传于世，今诸众生欢喜受持，自利利他，同趣佛道，非无益矣。冀后之览者，咸会斯旨，乃不负居士倡布之善意耳。岁躔鹑尾，如眼书。</p>
