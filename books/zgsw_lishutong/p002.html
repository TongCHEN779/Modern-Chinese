<section class="entry" id="e1">
<p class="v nv">小</p>
<p class="v nv">小僧衣萍是也，自从离开古庙，托钵上海，疾病缠绵，瞬将一载。死则心实不甘，生则未能愉快，呻吟卧榻，无计谋生。病中不能作文，乃将学道古庙时所作零星碎稿，编成斯集，并承苦雨斋中岂明大师之助，始克有成。以过时之笔墨，换糊<span class="sd">〔湖〕</span>口之金钱。境之所迫，无可奈何。况当此战云迷漫，民不聊生，不知命在何时，宁复计及名誉。茫茫四海，大雅君子，鉴之谅之。</p>
<p class="v nv">五，二十，衣萍自序。</p>
</section>
