<section class="entry" id="e1">
<p class="v nv">堕地苦晚，又樱尘劳。木替花荣，驹隙一瞬。俯仰之间，岁已弱冠。回思曩事，恍如昨晨。欣戚无端，抑郁谁语？爰托毫素，取志遗踪。旅邸寒灯，光仅如豆，成之一夕，不事雕劓。言属心声，乃多哀怨。江关庾信，花鸟杜陵。为溯前贤，益增惭恧！凡属知我，庶儿谅予。庚子正月。</p>
</section>
