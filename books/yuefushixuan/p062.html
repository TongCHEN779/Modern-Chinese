<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>江洪：梁诗人。祖籍济阳（今河南兰考一带）人。曾任建阳令，因事处死。曾有集二卷，佚。</p></div>
<p class="v nv">其一　风生绿叶聚，<br>波动紫茎开。<br>含花复含实，<br>正待佳人来。</p>
