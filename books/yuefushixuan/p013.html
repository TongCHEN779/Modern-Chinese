<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《李延年歌》：李延年，汉代中山（今河北中部）人，李延年作歌，其妹因此受汉武帝宠幸。延年因此受宠官至协律都尉。</p></div>
<p class="v nv poem">北方有佳人，<br>绝世而独立。<br>一顾倾人城，<br>再顾倾人国。<br>宁不知倾城与倾国，<br>佳人难再得。</p>
