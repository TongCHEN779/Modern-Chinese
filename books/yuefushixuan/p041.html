<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《大道曲》：据《乐府诗集》卷七十五引《乐府广题》说，谢尚为镇西将军，曾着紫罗襦，坐胡床在市中弹琵琶并作《大道曲》，人们不知他官至三公。</p><p>谢尚（308—357）：陈郡阳夏（今河南太康）人，官至尚书仆射。</p></div>
<p class="v nv poem">青阳二三月，<br>柳青桃复红。<br>车马不相识，<br>音落黄埃中。</p>
</section>
