<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《自君之出矣》：三国徐干诗句，刘骏用为诗题。</p><p>刘骏（430—464）：即宋孝武帝，字休龙。宋文帝子。元嘉三十年，刘劭杀文帝，刘骏起兵讨伐，遂继帝位。</p></div>
<p class="v nv">自君之出矣，<br>金翠阍无精。<br>思君如日月，<br>回环昼夜生。</p>
