<section class="entry" id="e1">
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《玉阶怨》：此诗是有意模仿谢朓之作的。《诗品》说当时人“学谢朓，劣得黄鸟度青枝”，即指此诗而言。</p><p>虞羲：字子阳，一字士光，会稽姚（今属浙江）人。南齐时为太学生，后官至晋安王侍郎，但不知指南齐晋安王或梁晋安王（即简文帝萧纲）。曾有集十卷，今佚。</p></div>
<p class="v nv">紫藤拂花树，<br>黄鸟度<sup class="n" data-n="1"></sup>青枝。<br>思君一叹息，<br>苦泪应言垂。</p>
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n2"><span class="caret">▸</span> 注释（1）</button><ul class="notes plain" id="n2" hidden><li>度：飞过。</li></ul>
</section>
