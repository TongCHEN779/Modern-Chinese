<section class="entry" id="e1">
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>陈留长公主：姓元氏，鲜卑族。魏孝文帝妹，初嫁刘昶，后嫁王肃。陈留长公主是她封号。</p></div>
<p class="v nv poem">针是贯线物，<br>目<sup class="n" data-n="1"></sup>中恒任丝<sup class="n" data-n="2"></sup>。<br>得帛缝新去，<br>何能纳故时。</p>
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n2"><span class="caret">▸</span> 注释（2）</button><ul class="notes plain" id="n2" hidden><li>目：指针孔。</li><li>丝：指线，又是“思”的谐音。</li></ul>
</section>
