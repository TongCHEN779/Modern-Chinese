<section class="entry" id="e1">
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《乌孙公主歌》：汉武帝以江都王建之女细君嫁西域乌孙王，公主作歌自悼。歌见《汉书·西域传》。</p></div>
<p class="v nv">吾家嫁我兮天一方，<br>远托异国兮乌孙王。<br>穹庐<sup class="n" data-n="1"></sup>为室兮旃<sup class="n" data-n="2"></sup>为墙，<br>以肉为食兮酪为浆。<br>居常土思兮心内伤，<br>愿为黄鹄兮归故乡。</p>
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n2"><span class="caret">▸</span> 注释（2）</button><ul class="notes plain" id="n2" hidden><li>穹庐：帐幕。</li><li>旃：同“毡”。</li></ul>
</section>
