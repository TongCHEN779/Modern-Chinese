<div class="reading-content">
<section class="entry" id="e1">
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《戚夫人歌》：戚夫人是汉高祖刘邦的宠妾，刘邦死后，被吕后所囚禁，罚她舂米，最后将她杀死。</p></div>
<p class="v nv">子为王<sup class="n" data-n="1"></sup>，<br>母为虏。<br>终日舂薄暮，<br>常与<sup class="n" data-n="2"></sup>死为伍<sup class="n" data-n="3"></sup>。<br>相离三千里，<br>当谁使告汝。</p>
<button class="note-btn" type="button" aria-expanded="false" aria-controls="n2"><span class="caret">▸</span> 注释（3）</button><ul class="notes plain" id="n2" hidden><li>子为王：指戚夫人所生子赵王刘如意，亦被吕后所杀。</li><li>“常与”句：经常有死的危险。</li><li>伍：伴。</li></ul>
</section>
