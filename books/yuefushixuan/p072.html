<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>《采荷调》：此曲是讽刺当时尚书仆射何敬容而作。“荷”是“何”的谐音。</p><p>江从简：南朝梁人，祖籍济阳考城（今河南兰考）人，曾任太尉从事中郎。侯景之乱，为任约所害。</p></div>
<p class="v nv poem">欲持荷作柱，<br>荷弱不胜梁。<br>欲持荷作镜，<br>荷暗本无光。</p>
