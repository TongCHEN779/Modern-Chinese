<section class="entry" id="e1">
<p class="v nv">自己的东西是永远不会满意的，所以校完后，除惭愧和加勉之外，一无话说。</p>
<p class="v nv">感谢鲁迅先生抽空为我作序。</p>
<p class="v nv">感谢新波先生日夜为我赶刻木刻，使我的这些不成器的东西，增加无限光彩。</p>
<p class="v nv">感谢丁、杜诸先生，及社中的好友。或为我奔走印刷，或为我校对，或为我发行与推销。</p>
