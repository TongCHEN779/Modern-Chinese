<section class="entry" id="e1">
<p class="v nv">陆峤南字更存，广西容县人。今录诗一首。</p>
</section>
<section class="entry" id="e2">
<h3>丙辰三月，南社雅集，为社盟宋桃源先生殉国之四年也，怆然有作</h3>
<p class="v nv">凭栏强自惜春，一笑那知酒入唇。未免花前犹忆汝，可怜地下已陈人。江山入梦兴亡易，风月当头感慨新。万里楚烟湘水碧，更从何处吊灵均？</p>
</section>
