<section class="entry" id="e1">
<p class="v nv">张冰字雪抱，江苏淮安人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>吴中旅夜不寐賦此</h3>
<p class="v nv">永夜不成寐，心随淮水流。披衣望北斗，伏枕卧南楼。莫道边关事，频添家国愁。听猿声泪下，作客几时休？</p>
</section>
<section class="entry" id="e3">
<h3>飘泊</h3>
<p class="v nv">瓢泊渺无定，终朝不系舟。疏星随地转，朗月逐江流。才大难为用，官应直道休。频看人海内，事事等浮鸥。</p>
</section>
