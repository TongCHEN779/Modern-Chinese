<section class="entry" id="e1">
<p class="v nv">邵庸舒字元冲，浙江绍兴人。今录诗一首。</p>
</section>
<section class="entry" id="e2">
<h3>与曼殊、孟硕同游江之岛</h3>
<p class="v nv">碧海擘烟峦，江岛启奇迹。素日澹窅冥，飞涛争翕辟。萦盘鸟道艰，逶迤鱼梁窄。垠塄披高萝，野竹翳危石。峥嵘百尺松，谡谡荡精魄。绝巘截行云，泛波湧石墀。蓉峰何崔巍，密若联茵席。乃知造化工，搏削同一脉。相对苦徘徊，暝霞送行客。</p>
</section>
