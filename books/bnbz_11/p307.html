<section class="entry" id="e1">
<p class="v nv">吕志伊字天民，云南思茅人。今录词二首。</p>
</section>
<section class="entry" id="e2">
<h3>临江仙别意</h3>
<p class="v nv">记得江干春送别，暖风香度蔷薇。临行握手问归期。柳纤裙带缓，花重帽檐欹。破浪乘风何处去，浮桥小立如痴。目穷千里镜难窥。海圆天欲合，船迅岸疑飞。</p>
<p class="v nv">记得长亭秋饯别，晓霜微醉枫林。将离欲语费沉吟。众前频接吻，髯戟惯能禁。汽笛一声郎去也，车轮碾碎依心。相思泪湿薄罗襟。白巾招展处，残月渐西沉。</p>
</section>
