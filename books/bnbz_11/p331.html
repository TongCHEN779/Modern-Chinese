<section class="entry" id="e1">
<p class="v nv">庞树松字独笑，江苏常熟人。今录词一首。</p>
</section>
<section class="entry" id="e2">
<h3>凤衔杯希姚属题毛韵珂饰约瑟芬小影，率填一解</h3>
<p class="v nv">王孙白马态翩翩。卷鸾花、重话当年。何意脂盟钿约、付寒烟。春易老、鬓空妍。狮发蜷，鹭冠偏。丰神婀娜复庄严。悄止宫娥低唱定西番。幽怨那能删。</p>
</section>
