<section class="entry" id="e1">
<p class="v nv">骆鹏字迈南，湖南湘阴人。今录诗四首。</p>
</section>
<section class="entry" id="e2">
<h3>寄怀师农</h3>
<p class="v nv">莽莽江城十丈埃，凭栏遥睇白云隈。风高尚有南飞雁，龙伏曾无启蛰雷。</p>
<p class="v nv">天教闲处著诗翁，十手传钞藻思雄。风月半庐消不尽，定分一半人诗筒。师农所居号半庐。</p>
<p class="v nv">元白卜邻曾有约，太平身世渺难期。轮困肝胆河山泪，未忍消磨付酒卮。</p>
<p class="v nv">中厨旨蓄叹无多，犹有壶飧佐啸歌。闲与细君商食政，为留玉糁待东坡。</p>
</section>
