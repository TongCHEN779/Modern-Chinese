<section class="entry" id="e1">
<p class="v nv">朱慕家字剑芒，江苏吴江人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>感怀</h3>
<p class="v nv">青衫习习晚风吹，凄绝江干笛一枝。客邸萧条春尽夜，愁怀浩荡梦醒时。十年病瘦灯前影，半壁尘封醉后诗。掷碎瑶琴焚笔砚，姓名恐怕被人知。</p>
<p class="v nv">曾把人情冷眼窥，芸芸绝似向阳葵。江山无主吾身贱，狐鼠成群国事危。剑不诛奸磨亦负，书难济世读何为？怜他屈子遭谣诼，泽畔行吟只自悲。</p>
</section>
