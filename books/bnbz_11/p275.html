<section class="entry" id="e1">
<p class="v nv">孙燮齐字鲁望，安徽寿县人。今录诗四首。</p>
</section>
<section class="entry" id="e2">
<h3>初秋即事</h3>
<p class="v nv">庭院秋阴向晚凉，碧窗帘影透花香。淡红浅绿无穷意，细雨芭蕉护海棠。</p>
<p class="v nv">古木荒凉掩薜萝，凉风晚眺意婆娑。伤心不解尘中事，情泪无端秋更多。</p>
<p class="v nv">秋思萦怀鬓欲华，青灯闲对葛巾斜。梧桐簌簌西风夜，落叶虫声满茜纱。</p>
<p class="v nv">重门夜掩悄无声，枕簟清寒梦不成。书卷抛残更欲断，帐纹如水篆烟轻。</p>
</section>
