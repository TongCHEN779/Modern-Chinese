<section class="entry" id="e1">
<p class="v nv">丁立中字和甫，浙江杭县人。今录诗三首。</p>
</section>
<section class="entry" id="e2">
<h3>题亚子《分湖旧隐图》</h3>
<p class="v nv">移居当日说灵芬，卜宅今同出岫云。香雪飘残温旧梦，一湖春色许平分。</p>
<p class="v nv">余家老屋在山阴，小筑团瓢住武林。蚕豆桥头今古月，感怀千里有同心。</p>
</section>
<section class="entry" id="e3">
<h3>题《三子游草》</h3>
<p class="v nv">风萍偶聚慰相思，仿佛兰亭修禊时。南社古欢真率会，西泠今雨岁寒枝。冷吟闲醉诗中画，山色湖光画里诗。缟纻珮环同一集，题名深惜我来迟。</p>
</section>
