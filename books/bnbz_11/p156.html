<section class="entry" id="e1">
<p class="v nv">胡熊锷字伯孝，广东顺德人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>生女慰内</h3>
<p class="v nv">瀼瀼冷露幽兰茁，襟祝初传莫喜悲。来日只应同负戴，于今何贵有须眉？霜林未合歌苤苜，秋实徒增慨黍离。一语慰卿聊索笑，士夫如鲫几男儿？</p>
</section>
<section class="entry" id="e3">
<h3>粲如到问偕隐内子目疾，代赋以谢之</h3>
<p class="v nv">盲风送劫下穷秋，闭目宁祛万古愁。眼底浮云成变幻，足音空谷到沉幽。出门未辨人间世，漆室难为国际谋。久病岂能经瞑眩，力微寒菊恐难瘳。</p>
</section>
