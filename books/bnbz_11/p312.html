<section class="entry" id="e2">
<h3>忆旧游怀仲通，步玉田寄元文韵</h3>
<p class="v nv">看西山已老，落尽桃红，飞絮飘零。旧梦寻难著，剩心田半顷，种遍愁根。满地槐花榆荚，夏木叶深深。恁只赢片纸，为寄殷勤。重逢竟何日，尚记得、徘徊刹海，绿阴浓处，同觅残莺。忽忽又经年矣，回首暗心惊。不语对中天，更阑烛烛凉气生。</p>
</section>
