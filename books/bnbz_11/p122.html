<section class="entry" id="e1">
<p class="v nv">李德群字经舆，湖南湘阴人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>纪梦二绝</h3>
<p class="v nv">一曲霓裳趁午风，玉箫金管彻珠宫。俄然数辈天魔舞，幻作桃花十丈红。</p>
<p class="v nv">扶摇九万五云高，梦境迷离也自豪。欲把鲲鹏拟蚨蝶，争知燕雀在蓬蒿。</p>
</section>
