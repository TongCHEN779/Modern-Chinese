<section class="entry" id="e1">
<p class="v nv">蒋信字蒋山，福建闽侯人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>饯除</h3>
<p class="v nv">多少人家列饯筵，韶华已老亦怆然。却因去日无佳日，莫负来年恰盛年。守夜不忘循旧例，忧时强半尚酣眠。留将统历编推表，喜听雄鸡唱晓天。</p>
</section>
<section class="entry" id="e3">
<h3>元旦</h3>
<p class="v nv">又从旧历话新年，霁日微云晓海天。南北一家成组织，军民万劫解颠连。看他应运兴龙虎，笑我忘机爱石泉。镜里须眉犹健在，春风生怕听啼鹃。</p>
</section>
