<section class="entry" id="e1">
<p class="v nv">蒋同超字万里，江苏无锡人。今录词一首。</p>
</section>
<section class="entry" id="e2">
<h3>如此江山</h3>
<p class="v nv">江山如此无人管。神州陆沉重见。祖脉昆仑，长流扬子，延得文明一线。天涯目断。看地尽尧封，疆分禹甸。一发中原，黄权濩落手谁援。古今豪杰何限。那二十四朝，底事龙战。莽莽欧风，沉沉墨雨，何似蓬莱清浅。茫茫震旦。慨前代沧桑，几经天演。民族潮流，一声声拍岸。</p>
</section>
