<p class="v nv">王汉章字吉乐，山东烟台人。今录词一首。</p>
</section>
<section class="entry" id="e2">
<h3>生查子闻某君有《安重根传》之作，随意讽咏，得句数四，适合此调，因略窜数字以协律</h3>
<p class="v nv">三韩侠少年，异世留侯也。漫道大功成，却共虫沙化。华表鹤归来，石上藤萝谢。只手挽狂澜，莫补江河下。</p>
</section>
<section class="entry" id="e3">
<h3>前调题艺棠肖像并寄之都门</h3>
<p class="v nv">忆昔义阳游，三载随缘住。吾去汝东归，汝送吾南去。无聊展写真，依旧葵园路。花发草堂前，想见当时处。</p>
</section>
