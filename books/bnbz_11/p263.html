<section class="entry" id="e1">
<p class="v nv">高圭字君介，江苏金山人。今录诗五首。</p>
</section>
<section class="entry" id="e2">
<h3>岳坟感賦</h3>
<p class="v nv">胡骑长驱彼一时，而今墓木不须悲。君看一例参天起，那异南枝与北枝？</p>
<p class="v nv">巍峨庙貌傍忠坟，千载长埋碧血殷。东海鲸波谁可靖？只今惜少岳家军。</p>
</section>
<section class="entry" id="e3">
<h3>游西溪</h3>
<p class="v nv">一径回环思渺然，丛林万竹绿参天。溪边更看垂垂柳，荡漾晴空万缕烟。</p>
</section>
<section class="entry" id="e4">
<h3>湖上感賦</h3>
<p class="v nv">容与中流荡桨来，壮怀郁郁一时开。似闻东海风涛险，击楫应需祖逖才。</p>
</section>
