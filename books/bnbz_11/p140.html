<section class="entry" id="e1">
<p class="v nv">刘师陶字沧霞，湖南醴陵人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>夜泊</h3>
<p class="v nv">挂席迎流不计程，停舟水驿更忘名。天风作雪寒侵骨，岸犬惊人吠有声。半壁河山伤豕突，片时泥爪类鸿征。宵深愈觉愁无奈，斜倚孤篷数断更。</p>
</section>
<section class="entry" id="e3">
<h3>次韵和钝根《闻韩事有感》</h3>
<p class="v nv">曾闻聂政能尸廆，无复於菟肯毁家。晋马嘶风尽东首，鲁戈促日竟西斜。故宫禾黍油油绿，废冢棠梨晔晔华。共道虢亡虞不腊，谁从覆辙悟前车？</p>
</section>
