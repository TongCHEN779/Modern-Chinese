<section class="entry" id="e1">
<p class="v nv">谢良牧字圉人，广东梅县人。今录诗三首。</p>
</section>
<section class="entry" id="e2">
<h3>书感</h3>
<p class="v nv">大江东去日西斜，酒半醒时恨倍赊。吴市吹箫燕市筑，依然歌哭走天涯。</p>
</section>
<section class="entry" id="e3">
<h3>除夕</h3>
<p class="v nv">郁郁适兹土，蹉跎岁又除。惯寻屠狗饮，幸避窃钩诛。痴梦争隍鹿，浮生过隙驹。大难来日事，搔首一长吁。</p>
</section>
<section class="entry" id="e4">
<h3>暮春书怀</h3>
<p class="v nv">一痕残梦已依稀，悔煞春前几事违。又是江南三月暮，杏花微雨燕双飞。</p>
</section>
