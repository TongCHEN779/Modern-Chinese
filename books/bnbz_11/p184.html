<section class="entry" id="e1">
<p class="v nv">李息字叔同，直隶天津人。为僧，号弘一。今录诗一首。</p>
</section>
<section class="entry" id="e2">
<h3>春游曲</h3>
<p class="v nv">春风吹面薄于纱，春人妆束淡于画。游春人在画中行，万花飞舞春人下。梨花淡白菜花黄，柳花委地芥花香。莺啼陌上人归去，花外疏钟送夕阳。</p>
</section>
