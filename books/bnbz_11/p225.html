<section class="entry" id="e1">
<p class="v nv">周祥骏字仲穆，江苏睢宁人。今录诗二首。</p>
</section>
<section class="entry" id="e2">
<h3>寄钝剑</h3>
<p class="v nv">春风料峭锁寒枝，强起酬君惠我诗。到眼都疑红泪溅，含毫期与素心宜。百年岁月催人老，两地情怀有梦知。曾梦与君对酌论诗。珍重前途惟自爱，斯文一线好撑持。</p>
</section>
<section class="entry" id="e3">
<h3>海上访亚子不值，寄呈一章</h3>
<p class="v nv">海气侵肌玉宇翻，嗟君小驻便还辕。誓心天地倡民约，过眼云烟失稼轩。尚待飞腾穷变怪，不应淹滞困丘樊。望尘瞻拜浑无及，聊写蛮笺当赠言。</p>
</section>
