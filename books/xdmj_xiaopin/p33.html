<section class="entry" id="e1">
<p class="v nv">南京城里有不少凯旋庆祝的牌坊：凯旋军分两种，一种是受伤的，一种是完全的；受伤的臂膀上套着金镯子银镯子，手指上戴着金戒宝石戒，肚袋里装满了袁世凯；完全的在下关开拍卖铺子，字画每卷两元，未付钱不准打开看，有的买着吴墨卿，金冬心，有的买着不知那一家祖宗的神主，平均起来祖宗比美术家多。</p>
<p class="v nv">（《现代评论》第1卷第3期，1925年1月3日）</p>
