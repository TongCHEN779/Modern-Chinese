<section class="entry" id="e1">
<p class="v nv">庐山名迹，顷刻未可穷尽，然山之灵异，尤在云霞，颇拟作新云赋以咏之。此塔不知名，然意境古澹绝俗，到此惟听松声鸟语，忘机亦忘世矣，寄崇弟玩玩。</p>
<p class="v nv">兄摩自牯岭，十五日</p>
<p class="v nv">（《子曰丛刊》，1948年10月25日）</p>
