<h1>乌云的金边<small>干校六记</small></h1>

<main class="reading-layout">

<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">按西方成语：“每一朵乌云都有一道银边”。丙午丁未年同遭大劫的人，如果经过不同程度的摧残和折磨，彼此间加深了一点了解，孳生了一点同情和友情，就该算是那一片乌云的银边或竟是金边吧？——因为乌云愈是厚密，银色会变为金色。</p>
<p class="v nv">常言“彩云易散”，乌云也何尝能永远占领天空。乌云蔽天的岁月是不堪回首的，可是停留在我记忆里不易磨灭的，倒是那一道含蕴着光和热的金边。</p>
</section>
