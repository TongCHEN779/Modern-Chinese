<section class="entry" id="e1">
<p class="v nv">丙午丁未年的大事是“史无前例的文化大革命”。旧社会过来的老知识分子不是“革命”的主要对象，尤其像我这种没有名位也从不掌权的人，一般只不过陪着挨斗罢了。这里所记的是一个“陪斗者”的经历，仅仅是这场“大革命”里的小小一个侧面。</p>
