<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>此首因长江以写真情，意新语妙，直类古乐府。起言相隔之远，次言相思之深。换头，仍扣定长江，言水无休时，恨亦无已时。末句，言两情不负，实本顾太尉语。</p></div>
<p class="v nv poem">我住长江头，<br>君住长江尾。<br>日日思君不见君，<br>共饮长江水。<br>此水几时休，<br>此恨何时已。<br>只愿君心似我心，<br>定不负相思意。</p>
