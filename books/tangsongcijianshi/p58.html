<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>此首题作《戏林推》，实含有无限家国之感。起言推之游侠生活，次言推之日夜豪情。换头，言冶游之无益，隐有劝勉之意。着末唤醒痴迷，似当头棒喝，警动非常。</p></div>
<p class="v nv poem">年年跃马长安市。<br>客舍似家家似寄。<br>青钱换酒日无何，<br>红烛呼卢宵不寐。<br>易挑锦妇机中字。<br>难得玉人心下事。<br>男儿西北有神州，<br>莫滴水西桥畔泪。</p>
