<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>此首怀人。语极质朴，情极深刻。起叙人去之久，音讯之疏。“春尽”两句，画出久荒之庭院。“手挼”句，写足娇痴无聊之情态。末两句，重叠问之，含思凄悲，想见泪随声落之概。</p></div>
<p class="v nv poem">一去又乖期信。<br>春尽。<br>满院长莓苔。<br>手挼裙带独徘徊。<br>来么来。<br>来么来。</p>
