<button class="note-btn" type="button" aria-expanded="false" aria-controls="n1"><span class="caret">▸</span> 题解</button><div class="notes intro-box" id="n1" hidden><p>此首写暮春景色，极见承平气象。起两句，写小庭苔深蕉卷。“蝴蝶”两句，写帘垂蝶飞，皆从帘内看出。下片记所闻，燕声簸钱声，皆从绿窗睡轻听得。通首写景，而人之闲适自如，即寓景中。</p></div>
<p class="v nv poem">绿芜墙绕青苔院。<br>中庭日淡芭蕉卷。<br>蝴蝶上阶飞。<br>风帘自在垂。<br>玉钩双语燕。<br>宝甃杨花转。<br>几处簸钱声。<br>绿窗春梦轻。</p>
