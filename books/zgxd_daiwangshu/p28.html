<section class="entry" id="e1">
<p class="v nv">是飘落深谷去的</p>
<p class="v nv">幽微的铃声吧，</p>
<p class="v nv">是航到烟水去的</p>
<p class="v nv">小小的渔船吧，</p>
<p class="v nv">如果是青色的真珠；</p>
<p class="v nv">它已堕到古井的暗水里。</p>
<p class="v nv">林梢闪着的颓唐的残阳，</p>
<p class="v nv">它轻轻地敛去了</p>
<p class="v nv">跟着脸上浅浅的微笑。</p>
<p class="v nv">从一个寂寞的地方起来的，</p>
<p class="v nv">迢遥的，寂寞的呜咽，</p>
<p class="v nv">又徐徐回到寂寞的地方，寂寞地。</p>
</section>
