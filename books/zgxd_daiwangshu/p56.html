<section class="entry" id="e1">
<p class="v nv">故乡芦花开的时候，</p>
<p class="v nv">旅人的鞋跟染着征泥，</p>
<p class="v nv">黏住了鞋跟，黏住了心的征泥，</p>
<p class="v nv">几时经可爱的手拂拭？</p>
<p class="v nv">栈石星饭的岁月，</p>
<p class="v nv">骤山骤水的行程：</p>
<p class="v nv">只有寂静中的促织声，</p>
<p class="v nv">给旅人尝一点家乡的风味。</p>
</section>
