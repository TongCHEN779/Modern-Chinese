<p class="v nv">靜掩的窗子隔住尘封的幸福，</p>
<p class="v nv">寂寞的温暖饱和着辽远的炊烟—</p>
<p class="v nv">陌生的声音还是解冻的呼唤？……</p>
<p class="v nv">挹泪的过客在往昔生活了一瞬间。</p>
<p class="v nv">一九四四年三月二日</p>
