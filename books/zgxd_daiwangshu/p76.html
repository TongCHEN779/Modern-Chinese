<section class="entry" id="e1">
<p class="v nv">给什么智慧给我，</p>
<p class="v nv">小小的白蝴蝶，</p>
<p class="v nv">翻开了空白之页，</p>
<p class="v nv">合上了空白之页？</p>
<p class="v nv">翻开的书页：</p>
<p class="v nv">寂寞；</p>
<p class="v nv">合上的书页：</p>
<p class="v nv">寂寞。</p>
<p class="v nv">一九四〇年五月三日</p>
