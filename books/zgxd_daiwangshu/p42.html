<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">对岸青叶荫下的野餐，</p>
<p class="v nv">只有百里香和野菊作伴；</p>
<p class="v nv">河水已洗涤了碍人的礼仪，</p>
<p class="v nv">白云遂成为飘动的天幕。</p>
<p class="v nv">那里有木叶一般绿的薄荷酒，</p>
<p class="v nv">和你所爱的芬芳的腊味，</p>
<p class="v nv">但是这里有更可口的芦笋</p>
<p class="v nv">和更新鲜的乳酪。</p>
<p class="v nv">我的爱软的草的小姐，</p>
<p class="v nv">你是知味的美食家：</p>
<p class="v nv">先尝这开胃的饮料，</p>
<p class="v nv">然后再试那丰盛的名菜。</p>
</section>
