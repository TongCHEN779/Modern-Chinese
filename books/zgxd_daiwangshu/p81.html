<section class="entry" id="e1">
<p class="v nv">我等待了两年，</p>
<p class="v nv">你们还是这样遥远啊！</p>
<p class="v nv">我等待了两年，</p>
<p class="v nv">我的眼睛已经望倦啊！</p>
<p class="v nv">说六个月可以回来啦，</p>
<p class="v nv">我却等待了两年啊，</p>
<p class="v nv">我已经这样衰败啦，</p>
<p class="v nv">谁知道还能够活几天啊。</p>
<p class="v nv">我守望着你们的脚步，</p>
<p class="v nv">在熟稔的贫困和死亡间，</p>
<p class="v nv">当你们再来，带着幸福，</p>
<p class="v nv">会在泥土中看见我张大的眼。</p>
<p class="v nv">一九四三年十二月三十一日</p>
</section>
