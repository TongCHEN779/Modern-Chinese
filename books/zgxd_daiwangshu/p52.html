<section class="entry" id="e1">
<p class="v nv">这里他来了：夜行者！</p>
<p class="v nv">冷清清的街上有沉着的楚音，</p>
<p class="v nv">从黑茫茫的雾，</p>
<p class="v nv">到黑茫茫的雾。</p>
<p class="v nv">夜的最熟稔的朋友，</p>
<p class="v nv">他知道它的一切琐碎，</p>
<p class="v nv">那么熟稔，在它的薰陶中</p>
<p class="v nv">他染了它一切最古怪的脾气。</p>
<p class="v nv">夜行者是最古怪的人。</p>
<p class="v nv">你看他走在黑夜里：</p>
<p class="v nv">戴着黑色的毡帽，</p>
<p class="v nv">迈着夜一样静的步子。</p>
</section>
