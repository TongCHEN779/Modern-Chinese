<section class="entry" id="e1">
<p class="v nv">春天已在野菊的头上逡巡着了，</p>
<p class="v nv">春天已在斑鸠的羽上逡巡着了，</p>
<p class="v nv">春天已在青溪的藻上逡巡着了，</p>
<p class="v nv">绿荫的林遂成为恋的众香国。</p>
<p class="v nv">于是原野将听倦了谎话的交换，</p>
<p class="v nv">而不载重的无邪的小草</p>
<p class="v nv">将醉着温软的皓体的甜香；</p>
<p class="v nv">于是，在暮色冥冥里，</p>
<p class="v nv">我将听了最后一个游女的惋叹，</p>
<p class="v nv">拈着一枝蒲公英缓缓地归去。</p>
</section>
