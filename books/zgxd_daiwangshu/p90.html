<section class="entry" id="e1">
<p class="v nv">如果生命的春天重到，</p>
<p class="v nv">古旧的凝冰都哗哗地解冻，</p>
<p class="v nv">那时我会再看见灿烂的微笑，</p>
<p class="v nv">再听见明朗的呼唤——这些迢遥的梦。</p>
<p class="v nv">这些好东西都决不会消失，</p>
<p class="v nv">因为一切好东西都永远存在，</p>
<p class="v nv">它们只是像冰一样凝结，</p>
<p class="v nv">而有一天会像花一样重开。</p>
<p class="v nv">一九四五年五月三十一日</p>
</section>
