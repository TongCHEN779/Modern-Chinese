<section class="entry" id="e1">
<p class="v nv">空白的诗帖，</p>
<p class="v nv">幸福的年岁；</p>
<p class="v nv">因为我苦涩的诗节，</p>
<p class="v nv">只为灾难树里程碑。</p>
<p class="v nv">即使清丽的词华</p>
<p class="v nv">也会消失它的光鲜，</p>
<p class="v nv">恰如你鬓边憔悴的花</p>
<p class="v nv">映着明媚的朱颜。</p>
<p class="v nv">不如寂寂地过一世，</p>
<p class="v nv">受着你光彩的薰沐，</p>
<p class="v nv">一旦为后人说起时，</p>
<p class="v nv">但叫人说往昔某人最幸福。</p>
<p class="v nv">一九四四年六月九日</p>
</section>
