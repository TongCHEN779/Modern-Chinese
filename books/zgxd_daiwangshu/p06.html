<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">残月是已死的美人，</p>
<p class="v nv">在山头哭泣嘤嘤，</p>
<p class="v nv">哭她细弱的魂灵。</p>
<p class="v nv">怪枭在幽谷悲鸣，</p>
<p class="v nv">饥狼在嘲笑声声，</p>
<p class="v nv">在那残碑断碣的荒坟。</p>
<p class="v nv">此地是黑暗的占领，</p>
<p class="v nv">恐怖在统治人群，</p>
<p class="v nv">幽夜茫茫地不明。</p>
<p class="v nv">来到此地泪盈盈，</p>
<p class="v nv">我是颠连飘泊的孤身</p>
<p class="v nv">我要与残月同沉。</p>
</section>
