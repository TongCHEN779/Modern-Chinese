<section class="entry" id="e1">
<p class="v nv">九月的霜花，</p>
<p class="v nv">十月的霜花，</p>
<p class="v nv">雾的娇女，</p>
<p class="v nv">开到我鬓边来。</p>
<p class="v nv">装点着秋叶，</p>
<p class="v nv">你装点了单调的死。</p>
<p class="v nv">雾的娇女，</p>
<p class="v nv">来替我簪你素艳的花。</p>
<p class="v nv">你还有珍珠的眼泪吗？</p>
<p class="v nv">太阳已不复重燃死灰了。</p>
<p class="v nv">我静观我鬓丝的零落，</p>
<p class="v nv">于是我迎来你所装点的秋。</p>
</section>
