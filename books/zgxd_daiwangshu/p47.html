<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">答应我绕过这些木栅，</p>
<p class="v nv">去坐在江边的游椅上。</p>
<p class="v nv">啮着沙岸的永远的波浪，</p>
<p class="v nv">总会从你投出着的素足</p>
<p class="v nv">撼动你抿紧的嘴唇的。</p>
<p class="v nv">而这里，鲜红并寂静得</p>
<p class="v nv">与你的嘴唇一样的枫林间，</p>
<p class="v nv">虽然残秋的风还未来到，</p>
<p class="v nv">但我已经从你的缄默里，</p>
<p class="v nv">觉出了它的寒冷。</p>
</section>
