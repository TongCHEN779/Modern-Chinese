<section class="entry" id="e1">
<p class="v nv">轻岚从远山飘开，</p>
<p class="v nv">水蜘蛛在静水上徘徊；</p>
<p class="v nv">说吧：无限意，无限意。</p>
<p class="v nv">有人微笑，</p>
<p class="v nv">一颗心开出花来，</p>
<p class="v nv">有人微笑，</p>
<p class="v nv">许多脸儿忧郁起来。</p>
<p class="v nv">做定情之花带的点缀吧，</p>
<p class="v nv">做迢遥之旅愁的凭借吧。</p>
</section>
