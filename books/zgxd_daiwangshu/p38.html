<section class="entry" id="e1">
<p class="v nv">迢遥的牧女的羊铃，</p>
<p class="v nv">摇落了轻的树叶。</p>
<p class="v nv">秋天的梦是轻的，</p>
<p class="v nv">那是窈窕的牧女之恋。</p>
<p class="v nv">于是我的梦是静静地来了，</p>
<p class="v nv">但却载着沉重的昔日。</p>
<p class="v nv">唔，现在，我是有一些寒冷，</p>
<p class="v nv">一些寒冷，和一些忧郁。</p>
</section>
