<section class="entry" id="e1">
<p class="v nv">怀着热望来相见，</p>
<p class="v nv">冀希从头细说，</p>
<p class="v nv">偏你冷冷无言；</p>
<p class="v nv">我只合踏着残叶</p>
<p class="v nv">远去了，自家伤感。</p>
<p class="v nv">希望今又成虚，</p>
<p class="v nv">且消受终天长怨。</p>
<p class="v nv">看风里的蜘蛛，</p>
<p class="v nv">又可怜地飘断</p>
<p class="v nv">这一缕零丝残绪。</p>
</section>
