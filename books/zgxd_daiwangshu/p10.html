<section class="entry" id="e1">
<p class="v nv">像侵晓薔薇底蓓蕾</p>
<p class="v nv">含着晶耀的香露，</p>
<p class="v nv">你盈盈地低泣，低着头，</p>
<p class="v nv">你在我心头开了烦忧路。</p>
<p class="v nv">你哭泣嘤嘤地不停，</p>
<p class="v nv">我心头反覆地不宁；</p>
<p class="v nv">这烦忧是从何处生</p>
<p class="v nv">使你坠泪，又使我伤心？</p>
<p class="v nv">停了泪儿啊，请莫悲伤，</p>
<p class="v nv">且把那原因细讲，</p>
<p class="v nv">在这幽夜沉寂又微凉，</p>
<p class="v nv">人静了，这正是时光。</p>
</section>
