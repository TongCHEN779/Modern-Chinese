<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">昏昏的灯，</p>
<p class="v nv">溟溟的雨，</p>
<p class="v nv">沉沉的未晓天：</p>
<p class="v nv">凄凉的情绪：</p>
<p class="v nv">将我的愁怀占住。</p>
<p class="v nv">凄绝的寂静中</p>
<p class="v nv">你还酣睡未醒；</p>
<p class="v nv">我无奈踯躅徘徊，</p>
<p class="v nv">独自凝泪出门：</p>
<p class="v nv">啊，我已够伤心。</p>
<p class="v nv">清冷的街灯，</p>
<p class="v nv">照着车儿前进：</p>
<p class="v nv">在我的胸怀里，</p>
<p class="v nv">我是失去了欢欣，</p>
<p class="v nv">愁苦已来临。</p>
</section>
