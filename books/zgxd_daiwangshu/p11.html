<section class="entry" id="e1">
<p class="v nv">见了你朝霞的颜色，</p>
<p class="v nv">便感到我落月的沉哀，</p>
<p class="v nv">却似晓天的云片，</p>
<p class="v nv">烦怨飘上我心来。</p>
<p class="v nv">可是不听你啼鸟的娇音，</p>
<p class="v nv">我就要像流水地呜咽，</p>
<p class="v nv">却似凝露的山花，</p>
<p class="v nv">我不禁地泪珠盈睫。</p>
<p class="v nv">我们彳亍在微茫的山径，</p>
<p class="v nv">让梦香吹上了征衣，</p>
<p class="v nv">和那朝霞，和那啼鸟，</p>
<p class="v nv">和你不尽的缠绵意。</p>
</section>
