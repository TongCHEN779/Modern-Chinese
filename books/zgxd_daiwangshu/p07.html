<section class="entry" id="e1">
<p class="v nv">不要说爱还是恨，</p>
<p class="v nv">这问题我不要分明：</p>
<p class="v nv">当我们提壶痛饮时，</p>
<p class="v nv">可先问是酸酒是芳醇？</p>
<p class="v nv">愿她温温的眼波</p>
<p class="v nv">荡醒我心头的春草：</p>
<p class="v nv">谁希望有花儿果儿？</p>
<p class="v nv">但愿在春天里活几朝。</p>
</section>
