<section class="entry" id="e1">
<p class="v nv">我如今已厌看蔷薇色，</p>
<p class="v nv">一任她娇红披满枝。</p>
<p class="v nv">心头的春花已不更开，</p>
<p class="v nv">幽黑的烦忧已到我欢乐之梦中来。</p>
<p class="v nv">我的唇已枯，我的眼已枯，</p>
<p class="v nv">我呼吸着火焰，我听见幽灵低诉。</p>
<p class="v nv">去吧，欺人的美梦，欺人的幻象，</p>
<p class="v nv">天上的花枝，世人安能痴想！</p>
<p class="v nv">我颓唐地在挨度这迟迟的朝夕，</p>
<p class="v nv">我是个疲倦的人儿，我等待着安息。</p>
</section>
