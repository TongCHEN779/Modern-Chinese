<h1>三顶礼<small>中国现代作家选集·戴望舒</small></h1>

</header>
<main class="reading-layout">
<details class="toc side" open data-cur="p43.html"><summary>总目录</summary><ul></ul><template></template><noscript><p><a href="index.html">全书目录</a></p></noscript></details><script src="toc.js?v=9803a20d"></script>
<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">引起寂寂的旅愁的，</p>
<p class="v nv">翻着软浪的暗暗的海，</p>
<p class="v nv">我的恋人的发，</p>
<p class="v nv">受我怀念的顶礼。</p>
<p class="v nv">恋之色的夜合花，</p>
<p class="v nv">佻达的夜合花，</p>
<p class="v nv">我的恋人的眼，</p>
<p class="v nv">受我沉醉的顶礼。</p>
<p class="v nv">给我苦痛的螫的，</p>
<p class="v nv">苦痛的但是欢乐的螫的，</p>
<p class="v nv">你小小的红翅的蜜蜂，</p>
<p class="v nv">我的恋人的唇，</p>
<p class="v nv">受我怨恨的顶礼。</p>
</section>
