<p class="v nv">我思想，故我是蝴蝶……</p>
<p class="v nv">万年后小花的轻呼</p>
<p class="v nv">透过无梦无醒的云雾，</p>
<p class="v nv">来振撼我斑斓的彩翼。</p>
<p class="v nv">一九三七年三月十四日</p>
