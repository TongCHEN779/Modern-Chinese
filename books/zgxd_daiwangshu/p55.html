<section class="entry" id="e1">
<p class="v nv">是簪花的老人呢，</p>
<p class="v nv">灰暗的篱笆披着鸢萝，</p>
<p class="v nv">旧曲在颤动的枝叶间死了，</p>
<p class="v nv">新蜕的蝉用单调的生命赓续。</p>
<p class="v nv">结客寻欢都成了后悔，</p>
<p class="v nv">还要学少年的行蹊吗？</p>
<p class="v nv">平静的天，平静的阳光下，</p>
<p class="v nv">烂熟的果子平静地落下来了。</p>
</section>
