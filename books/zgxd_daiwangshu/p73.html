<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">园中野草渐离离，</p>
<p class="v nv">托根于我旧时的脚印，</p>
<p class="v nv">给他们披青春的彩衣：</p>
<p class="v nv">星下的盘桓从兹消隐。</p>
<p class="v nv">日子过去，寂寞永存，</p>
<p class="v nv">寄魂于离离的野草，</p>
<p class="v nv">像那些可怜的灵魂，</p>
<p class="v nv">长得如我一般高。</p>
<p class="v nv">我今不复到园中去，</p>
<p class="v nv">寂寞已如我一般高：</p>
<p class="v nv">我夜坐听风，昼眠听雨，</p>
<p class="v nv">悟得月如何缺，天如何老。</p>
<p class="v nv">一九三七年二月十二日</p>
</section>
