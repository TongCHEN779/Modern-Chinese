<section class="entry" id="e1">
<p class="v nv">新的年岁带给我们新的希望。</p>
<p class="v nv">祝福！我们的土地，</p>
<p class="v nv">血染的土地，焦裂的土地，</p>
<p class="v nv">更坚强的生命将从而滋长。</p>
<p class="v nv">新的年岁带给我们新的力量。</p>
<p class="v nv">祝福！我们的人民，</p>
<p class="v nv">坚苦的人民，英勇的人民，</p>
<p class="v nv">苦难会带来自由解放。</p>
<p class="v nv">一九三九年元旦日</p>
</section>
