<p class="v nv">一枝，两枝，三枝，</p>
<p class="v nv">床巾上的图案花</p>
<p class="v nv">为什么不结果子啊！</p>
<p class="v nv">过去了：春天，夏天，秋天。</p>
<p class="v nv">明天梦已凝成了冰柱；</p>
<p class="v nv">还会有温煦的太阳吗？</p>
<p class="v nv">纵然有温煦的太阳，跟着檐溜，</p>
<p class="v nv">去寻坠梦的玎珞吧！</p>
