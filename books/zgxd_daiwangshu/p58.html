<section class="entry" id="e1">
<p class="v nv">五月的园子，</p>
<p class="v nv">已花繁叶满了，</p>
<p class="v nv">浓荫里却静无鸟喧。</p>
<p class="v nv">小径已铺满苔藓，</p>
<p class="v nv">而篱门的锁也锈了——</p>
<p class="v nv">主人却在迢遥的太阳下。</p>
<p class="v nv">在迢遥的太阳下，</p>
<p class="v nv">也有璀璨的园林吗？</p>
<p class="v nv">陌生人在篱边探首，</p>
<p class="v nv">空想着天外的主人。</p>
</section>
