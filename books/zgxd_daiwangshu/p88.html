<p class="v nv">走六小时寂寞的长途，</p>
<p class="v nv">到你头边放一束红山茶，</p>
<p class="v nv">我等待着，长夜漫漫，</p>
<p class="v nv">你却卧听着海涛闲话。</p>
<p class="v nv">一九四四年十一月二十日</p>
