<section class="entry" id="e1">
<p class="v nv">泣与笑，恋与愿与恩怨，</p>
<p class="v nv">难得的青年，倏忽的青年，</p>
<p class="v nv">前面有座铁打的城垣，青年，</p>
<p class="v nv">你进了城垣，永别了春光，</p>
<p class="v nv">永别了青年，恋与愿与恩怨！</p>
<p class="v nv">妙乐与酒与玫瑰，不久住人间，</p>
<p class="v nv">青年，彩虹不常在天边，</p>
<p class="v nv">梦里的颜色，不能永葆鲜妍，</p>
<p class="v nv">你须珍重，青年，你有限的脉搏，</p>
<p class="v nv">休教幻景似的消散了你的青年！</p>
</section>
