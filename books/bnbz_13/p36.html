<section class="entry" id="e1">
<p class="v nv">雷雨暂时收敛了；</p>
<p class="v nv">双龙似的双虹，</p>
<p class="v nv">显现在雾霭中，</p>
<p class="v nv">夭矫，鲜艳，生动，</p>
<p class="v nv">好兆！明天准是好天了。</p>
<p class="v nv">什么！又是一阵打雷，一</p>
<p class="v nv">在云外，在天外，</p>
<p class="v nv">又是一片暗淡，</p>
<p class="v nv">不见了鲜虹彩，</p>
<p class="v nv">希望，不曾站稳，又毁。</p>
</section>
