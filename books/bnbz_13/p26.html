<section class="entry" id="e1">
<p class="v nv">我送你一个雷峰塔影，</p>
<p class="v nv">满天稠密的黑云与白云；</p>
<p class="v nv">我送你一个雷峰塔顶，</p>
<p class="v nv">明月泻影在眠熟的波心。</p>
<p class="v nv">深深的黑夜，依依的塔影，</p>
<p class="v nv">团团的月彩，纤纤的波鳞</p>
<p class="v nv">假如你我荡一支无遮的小艇，</p>
<p class="v nv">假如你我创一个完全的梦境！</p>
</section>
