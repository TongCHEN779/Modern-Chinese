<section class="entry" id="e1">
<p class="v nv">匆匆匆！催催催！</p>
<p class="v nv">一卷烟，一片山，几点云影，</p>
<p class="v nv">一道水，一条桥，一支橹声，</p>
<p class="v nv">一林松，一丛竹，红叶纷纷。</p>
<p class="v nv">艳色的田野，艳色的秋景，</p>
<p class="v nv">梦境似的分明，模糊，消隐，</p>
<p class="v nv">催催催！是车轮还是光阴？</p>
<p class="v nv">催老了秋容，催老了人生！</p>
</section>
