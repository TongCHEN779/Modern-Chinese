<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">这岂是偶然，小玲珑的野花！</p>
<p class="v nv">你轻含着鲜露颗颗，</p>
<p class="v nv">怦动的，像是慕光明的花蛾，</p>
<p class="v nv">在黑暗里想念焰彩，晴霞；</p>
<p class="v nv">我此时在这蔓草丛中过路，</p>
<p class="v nv">无端的内感惘怅与惊讶，</p>
<p class="v nv">在这迷雾里，在这岩壁下，</p>
<p class="v nv">思忖着，泪怦怦的，人生与鲜露？</p>
</section>
