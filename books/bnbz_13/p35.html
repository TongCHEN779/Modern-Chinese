<section class="entry" id="e1">
<p class="v nv">这是冬夜的山坡，</p>
<p class="v nv">坡下一座冷落的僧庐，</p>
<p class="v nv">庐内一个孤独的梦魂：</p>
<p class="v nv">在忏悔中祈祷，在绝望中沈沦；</p>
<p class="v nv">为什么这怒噭，这狂歉，</p>
<p class="v nv">鼍鼓与金钲与虎与豹？</p>
<p class="v nv">为什么这幽诉，这私慕？</p>
<p class="v nv">烈情的惨剧与人生的坎坷</p>
<p class="v nv">又一度潮水似的淹没了</p>
<p class="v nv">这彷徨的梦魂与冷落的僧庐？</p>
</section>
