<p class="v nv">革新思想的先觉，</p>
<p class="v nv">整理国故之大师。</p>
<p class="v nv">任公先生不朽。</p>
<p class="v nv">后学钱玄同敬挽。</p>
<p class="v nv">（本联作于1929年，据手稿《挽联集》录出。）</p>
