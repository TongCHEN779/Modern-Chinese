<section class="entry" id="e1">
<p class="v nv">小学本师传，更细绎韵纽源流，黾勉求之，于古音独明其真谛。</p>
<p class="v nv">文章宗六代，专致力沉思翰藻，如何不淑，吾同门遽丧此隽才！</p>
<p class="v nv">与季刚自己酉年订交，至今已二十有六载，平日因性情不合，时有违言。惟民国四、五年间商量音韵，最为契合。二十一年之春，于余杭师座中一言不合，竟致斗口。岂期此别，竟成永诀！</p>
<p class="v nv">（本篇发表于1936年1月《制言》第7期）</p>
