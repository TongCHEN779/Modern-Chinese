<section class="entry" id="e1">
<p class="v nv">民国甘三年二月廿日启明游旧都厂甸肆，于东莞伦氏之通学斋书摊见此潭仲修丈所藏之戴子高先生《论语注》，悦之，以告玄同。翌日玄同往游，遂购而奉赠启明。</p>
<p class="v nv">（本篇引自周作人《周作人文类编》）</p>
