<section class="entry" id="e1">
<p class="v nv">擅国语，考方言，声韵多端，精求无间。回忆十年以来，标准读音全赖商定，《广韵》《集韵》亦得诠明。君对国人，实多贡献。</p>
<p class="v nv">与人忠，执事敬，年力鼎盛，进德何穷。讵意旬日之内，惕夫斯菌忽来侵袭，少者强者竟尔天殁！我聆噩耗，能勿惨伤！</p>
<p class="v nv">（本篇发表于1934年10 月27 日《国语周刊》161期）</p>
