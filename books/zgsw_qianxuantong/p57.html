<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">卅载周游，用新知新理，启牖颛蒙，具上说下教精神，宜为国人所矜式。</p>
<p class="v nv">一生作事，务自洁自尊，不随流俗，此特立独行气象，永诒子弟以楷模。</p>
<p class="v nv">大兄不死。</p>
<p class="v nv">弟玄同肃挽。</p>
<p class="v nv">（本联作于1927年，据手稿《挽联集》录出。）</p>
</section>
