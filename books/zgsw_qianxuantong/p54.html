<section class="entry" id="e1">
<p class="v nv">我从中华民国二十二年七月二日起，当天发誓，绝对戒酒，即对于周百药马凡将二氏亦不敷衍矣。恐后无凭，立此存照。钱龟竞。</p>
<p class="v nv">（本篇引自周作人《饭后随笔》，周百药即周作人，马凡将即马叔平。）</p>
