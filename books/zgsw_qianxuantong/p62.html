<section class="entry" id="e1">
<p class="v nv">网罗明季乡邦文献，精忠劲节，最所表扬，孤怀上拟全双韭。</p>
<p class="v nv">研治近代小说传奇，显微阐幽，极多创获，博览堪追冯梦龙。</p>
<p class="v nv">隅卿老兄不朽。</p>
<p class="v nv">弟钱玄同敬挽。</p>
<p class="v nv">（本联作于1935年，据手稿《挽联集》录出。）</p>
</section>
