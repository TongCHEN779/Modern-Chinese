<section class="entry" id="e1">
<p class="v nv">读中史，阐君权道学之弊。</p>
<p class="v nv">讲□□，以化蒙保族为怀。</p>
<p class="v nv">中华民国甘三年（公历一九三四）四月三日为浩吾先生辞世周年，敬述先生丁酉年（公历一八九七）所撰《初学读书要略》中名论以追悼先生。</p>
<p class="v nv">后学钱玄同。</p>
<p class="v nv">（本联作于1934年，据手稿《挽联集》录出，原稿缺两字，似斟酌未定者。）</p>
