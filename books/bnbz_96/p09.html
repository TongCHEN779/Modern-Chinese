<section class="entry" id="e1">
<p class="v nv">〔南尾]乱纷纷落叶滚尘埃，冷清清旧天街。瘆人心一壁素白，刺人眼朝霞彩。恨深深一年时光改，凄惶惶割舍了旧楼台。问秋道路阻雾迷关隘，衣衫薄影断苍风何事吹痛离人泪满腮。山寨。把心儿向国托，身儿向前赶，魂儿故土埋！且休问得不得回来！</p>
