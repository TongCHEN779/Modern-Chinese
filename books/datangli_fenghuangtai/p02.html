<section class="entry" id="e1">
<p class="v nv">凤凰台上凤凰游，凤去台空江自流。</p>
<p class="v nv">吴宫花草埋幽径，晋代衣冠成古丘。</p>
<p class="v nv">三山半落青天外，二水中分白鹭洲。</p>
<p class="v nv">总为浮云能蔽日，长安不见使人愁。</p>
<p class="v nv">——李白《登金陵凤凰台》</p>
