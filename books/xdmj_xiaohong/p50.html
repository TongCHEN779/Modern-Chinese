<p class="v nv">雪天里，村人们永没见过的旗子飘扬起，升上天空！</p>
<p class="v nv">全村寂静下去，只有日本旗子在山岗临时军营门前，振荡的响着。</p>
<p class="v nv">村人们在想：这是什么年月？中华国改了国号吗？</p>
