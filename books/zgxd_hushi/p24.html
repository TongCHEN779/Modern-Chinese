<section class="entry" id="e1">
<p class="v nv">雾散云开自有时，</p>
<p class="v nv">暂时埋没不须悲。</p>
<p class="v nv">青山待我重来日，</p>
<p class="v nv">大写靑山第二碑。</p>
<p class="v nv">二十四，七五。</p>
<p class="v nv">（选自《胡适之先生诗歌手迹》）</p>
