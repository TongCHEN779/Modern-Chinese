<section class="entry" id="e1">
<p class="v nv">我大清早起，</p>
<p class="v nv">站在人家屋角上哑哑的啼。</p>
<p class="v nv">人家讨嫌我，说我不吉利，</p>
<p class="v nv">我不能呢呢喃喃讨人家的欢喜！</p>
<p class="v nv">二</p>
<p class="v nv">天寒风紧，无枝可栖。</p>
<p class="v nv">我整日里飞去飞回，整日里又寒又饥，</p>
<p class="v nv">我不能带着鞘儿，翁翁央央的替人家飞，</p>
<p class="v nv">也不能叫人家系在竹竿头，赚一把黄小米！</p>
<p class="v nv">（选自《尝试集》增订四版）</p>
</section>
