<section class="entry" id="e1">
<p class="v nv">（为北京高师平民学校作的）</p>
<p class="v nv">靠着两只手，</p>
<p class="v nv">拚得一身血汗，</p>
<p class="v nv">大家努力做个人，</p>
<p class="v nv">不做工的不配吃饭！</p>
<p class="v nv">做工即是学，</p>
<p class="v nv">求学即是做工：</p>
<p class="v nv">大家努力做先锋，</p>
<p class="v nv">同做有意识的劳动！</p>
<p class="v nv">十年四月十二日</p>
<p class="v nv">（选自《尝试集》增订四版）</p>
