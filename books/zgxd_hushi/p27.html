<p class="v nv">略有几茎白发，</p>
<p class="v nv">心情已近中年，</p>
<p class="v nv">做了过河卒子，</p>
<p class="v nv">只能拚命向前。</p>
<p class="v nv">二十七（一九三八）年十月三十一日，在美京。</p>
<p class="v nv">（选自《胡适之先生诗歌手迹》）</p>
