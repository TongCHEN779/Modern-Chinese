<section class="entry" id="e1">
<p class="v nv">云淡天高，好一片晚秋天气！</p>
<p class="v nv">有一群鸽子，在空中游戏。</p>
<p class="v nv">看他们三三两两，</p>
<p class="v nv">回环来往，</p>
<p class="v nv">夷犹如意，</p>
<p class="v nv">忽地里翻身，映日白羽衬青天，</p>
<p class="v nv">十分鲜丽！</p>
<p class="v nv">（选自《尝试集》增订四版）</p>
