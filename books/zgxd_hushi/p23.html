<section class="entry" id="e1">
<p class="v nv">这里长眠的是二百零三个中国好男子！</p>
<p class="v nv">他们把他们的生命献给了他们的祖国。</p>
<p class="v nv">我们和我们的子孙来这里凭吊敬礼的，</p>
<p class="v nv">要想想我们应该用什么报答他们的血！</p>
<p class="v nv">（选自《胡适之先生诗歌手迹》，台湾商务印书馆一九六四年十二月出版）</p>
