<section class="entry" id="e1">
<p class="v nv">更不伤春，更不悲秋，以此誓诗。任花开也好，花飞也好，月圆固好，日落何悲？我闻之曰，“从天而颂，孰与制天而用之？”更安用为苍天歌哭，作彼奴为！</p>
<p class="v nv">文章革命何疑！且准备搴旗作健儿。要前空千古，下开百世，收他臭腐，还我神奇。为大中华，造新文学，此业吾曹欲让谁？诗材料，有簇新世界，供我驱驰。</p>
<p class="v nv">五年四月十二日。</p>
<p class="v nv">（选自《尝试集》增订四版所附《去国集》）</p>
</section>
