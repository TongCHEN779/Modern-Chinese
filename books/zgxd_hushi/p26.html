<section class="entry" id="e1">
<p class="v nv">四百里的赫贞江，</p>
<p class="v nv">从容的流下纽约湾，</p>
<p class="v nv">恰像我的少年岁月，</p>
<p class="v nv">一去了永不回还。</p>
<p class="v nv">这江上曾有我的诗，</p>
<p class="v nv">我的梦，我的工作，我的爱。</p>
<p class="v nv">毁灭了的似绿水长流，</p>
<p class="v nv">留住了的似青山还在。</p>
<p class="v nv">一九三八年四月十九日</p>
<p class="v nv">（选自《胡适之先生诗歌手迹》）</p>
</section>
