<section class="entry" id="e1">
<p class="v nv">两个黄蝴蝶，双双飞上天。</p>
<p class="v nv">不知为什么，一个忽飞还。</p>
<p class="v nv">剩下那一个，孤单怪可怜，</p>
<p class="v nv">也无心上天，天上太孤单。</p>
<p class="v nv">五年八月二十三日。</p>
<p class="v nv">（选自《尝试集》上海亚东图书馆一九二二年十月增订四版）</p>
