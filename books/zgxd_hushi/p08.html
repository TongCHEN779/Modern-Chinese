<div class="reading-content">
<section class="entry" id="e1">
<p class="v nv">我喜欢你这颗顶大的星儿，</p>
<p class="v nv">可惜我叫不出你的名字。</p>
<p class="v nv">平日月明时，月光遮尽了满天星，总不能遮住你。</p>
<p class="v nv">今天风雨后，闷沉沉的天气，</p>
<p class="v nv">我望遍天边，寻不见一点半点光明，</p>
<p class="v nv">回转头来，</p>
<p class="v nv">只有你在那杨柳高头，依旧亮晶晶地。</p>
<p class="v nv">八年四月二十五夜。</p>
<p class="v nv">（选自《尝试集》增订四版）</p>
</section>
