<section class="entry" id="e1">
<p class="v nv">藏晖先生昨夜作一梦，</p>
<p class="v nv">梦见苦雨庵中吃茶的老僧。</p>
<p class="v nv">忽然放下茶钟出门去，</p>
<p class="v nv">飘萧一杖天南行。</p>
<p class="v nv">天南万里岂不太辛苦？</p>
<p class="v nv">只为智者识得重与轻。</p>
<p class="v nv">梦醒我自披衣开窗坐，</p>
<p class="v nv">谁人知我此时一点相思情！</p>
<p class="v nv">一九三八，八，四，在伦敦。</p>
<p class="v nv">（选自《胡适之先生诗歌手迹》）</p>
</section>
