<section class="entry" id="e1">
<p class="v nv">左氏《国语》，其文深闳杰异，固世之所耽嗜而不已也。而其说多诬淫，不概于圣。余惧世之学者溺其文采而沦于是非，是不得由中庸以入尧、舜之道。本诸理，作《非国语》。</p>
